name: Check pull request

on:
    pull_request:
        types:
            - opened
            - reopened

permissions:
    contents: read

jobs:
    lint:
        name: Lint code
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 26

            - name: Install dependencies
              run: npm ci

            - name: Run linting
              run: npm run lint

    test:
        name: Run tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v7
              with:
                  node-version: 26

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm run test
